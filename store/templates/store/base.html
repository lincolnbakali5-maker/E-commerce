{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lincoln Hat Store</title>
    <link rel="stylesheet" href="{% static 'store/styles.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <a href="{% url 'store:home' %}">Lincoln Hats</a>
        </div>
        <nav class="nav-links">
            <a href="{% url 'store:home' %}">Home</a>
            <a href="{% url 'store:product_list' %}">Products</a>
            <a href="{% url 'store:cart' %}">Cart{% if cart_count %} ({{ cart_count }}){% endif %}</a>
        </nav>
    </header>

    <main class="page-container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Built with Django, Python, HTML, and CSS.</p>
    </footer>
</body>
</html>
